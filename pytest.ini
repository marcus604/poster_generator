[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Override Docker paths so singletons can initialise locally
env =
    OUTPUT_PATH=/tmp/placard_test_output
    CACHE_DIR=/tmp/placard_test_cache
    VIDEO_PATHS=/tmp/placard_test_videos
